[project]
name = "controller-service"
version = "0.1.0"
description = "Real-time NPC controller service for the directable-intelligence Unity co-op companion"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]
